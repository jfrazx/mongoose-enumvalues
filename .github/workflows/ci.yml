name: CI

on:
  # Deliberately master-only. A push to a branch with an open PR is already
  # covered by the pull_request event, and running both would double every
  # job: the concurrency group below cannot dedupe them, because a push
  # resolves `github.ref` while a pull_request resolves `github.head_ref`, so
  # the two events never share a group key.
  #
  # Accepted gap: a branch pushed with no PR open gets no CI until one is
  # opened. The gate this phase exists to enforce is on merges to master, and
  # every merge goes through a PR.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Keyed on head_ref for pull_request events so a PR's runs supersede each
# other. Using github.ref alone would give push and pull_request events
# different groups and deduplicate neither.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # mongodb-memory-server's postinstall hook downloads a ~77MB binary on every
  # `npm ci`, into node_modules/.cache, which setup-node does not cache and
  # which the runtime would then prefer over the directory that *is* cached.
  # Disabled so the only download is the one the cache below actually stores.
  MONGOMS_DISABLE_POSTINSTALL: '1'

jobs:
  test:
    name: test · node ${{ matrix.node }} · mongoose ${{ matrix.mongoose }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        mongoose: [8, 9]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Only the 9 legs override. Running this unguarded would re-resolve
      # mongoose from the registry on the 8 legs too, silently replacing the
      # lockfile version that is supposed to be the baseline.
      - name: Install mongoose ${{ matrix.mongoose }}
        if: matrix.mongoose != 8
        run: npm install --no-save mongoose@${{ matrix.mongoose }}

      # src/ is otherwise only typechecked against the lockfile's 8 (the lint
      # job), and D30 on #15 requires both halves of the peer range.
      - name: Typecheck against mongoose ${{ matrix.mongoose }}
        if: matrix.mongoose != 8
        run: npm run typecheck

      # Keyed on globalSetup.mts, which carries the pinned MongoDB version.
      # restore-keys lets an unrelated edit to that file reuse the existing
      # binary instead of re-downloading it.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('test/globalSetup.mts') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - run: npm test

  lint:
    name: lint, typecheck and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 only. Lint is toolchain, not behaviour, so it does not need the
      # matrix — and eslint@10 requires ^22.13, which the package's own 22.12
      # floor would not guarantee. Locked as D13 on #13.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  # Packs exactly what `npm publish` would: prepack runs the build, and the
  # build runs publint and attw against the packed tarball, failing on
  # either. Node 24 only, for the same reason as lint -- tsdown requires
  # ^22.18, above the package's own floor. D19, D22 and D23 on #14.
  package:
    name: build and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: mongoose-enumvalues-*.tgz
          if-no-files-found: error

  # Installs that same tarball into the consumer fixtures and checks it from
  # the outside: typechecked as an ESM and a CommonJS consumer would see it,
  # then loaded through Node's own import and require. Built once on 24, and
  # exercised here on the same Node lines as the test matrix. D17 on #14.
  #
  # Against both halves of the peer range, since the published declarations
  # import mongoose's types. Both halves gate, as they do in the test matrix.
  consumers:
    name: consumers · node ${{ matrix.node }} · mongoose ${{ matrix.mongoose }}
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        mongoose: [8, 9]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # For mongoose, typescript and @types/node, which the fixtures resolve
      # from the repository root.
      - run: npm ci

      # Guarded for the same reason as in the test matrix.
      - name: Install mongoose ${{ matrix.mongoose }}
        if: matrix.mongoose != 8
        run: npm install --no-save mongoose@${{ matrix.mongoose }}

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifact

      - run: npm run test:package -- artifact/*.tgz

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Runs after the matrix so it restores a warm cache rather than joining
    # the cold-start download.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('test/globalSetup.mts') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      # Gated. The thresholds in vitest.config.mjs now gate this step (D31 on
      # #15, deferred there by D12 on #13), so a drop in coverage fails the
      # job.
      #
      # tee keeps vitest's full output in the job log. pipefail gives the
      # pipeline vitest's exit status rather than tee's, and `|| status=$?`
      # holds it, so the summary is written before the step exits with it.
      # The summary takes the coverage table and any threshold ERROR lines,
      # which vitest prints after the table. NO_COLOR so both are plain text
      # rather than ANSI escapes, which vitest emits whenever CI is set.
      - name: Check coverage
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/coverage.log"
          status=0
          npm run test:coverage --silent 2>&1 | tee "$log" || status=$?
          {
            echo '## Coverage'
            echo
            echo '```'
            sed -n '/% Stmts/,/^[[:space:]]*$/p' "$log"
            grep '^ERROR:' "$log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
